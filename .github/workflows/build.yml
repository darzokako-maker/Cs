name: Stealth Build
on: [push, workflow_dispatch] # Her kod gönderdiğinde veya elinle başlattığında çalışır

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build External Stealth
        run: |
          msbuild StealthCheat.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Security_Update_v1 # İndireceğin dosyanın adı
          path: x64/Release/*.exe
          
