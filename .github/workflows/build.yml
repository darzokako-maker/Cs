name: Generate CS2 EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        pip install pymem pygame keyboard pywin32 pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --uac-admin main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CS2-External-Output
        path: dist/main.exe
        
